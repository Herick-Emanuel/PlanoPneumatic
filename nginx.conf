server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  resolver ${NGINX_RESOLVER} valid=300s;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /logo.png {
    try_files /LogoPneumatic.png =404;
  }

  location = /api {
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /frontend {
    return 301 /frontend/;
  }

  location = /frontend/api {
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /frontend/api/ {
    rewrite ^/frontend(/api/.*)$ $1 break;
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /frontend/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://planopneumaticapi-production.up.railway.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    rewrite ^/frontend/?(.*)$ /$1 break;
    try_files /html$uri $uri $uri/ /html/index.html;
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://planopneumaticapi-production.up.railway.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files /html$uri $uri $uri/ /html/index.html;
  }
}
