server {
  listen ${PORT};
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  # DNS para resolver API_UPSTREAM_URL: o da plataforma (/etc/resolv.conf) ou NGINX_RESOLVER.
  resolver ${NGINX_RESOLVER} valid=300s;

  # IP real do cliente: o proxy da plataforma (Railway) envia X-Forwarded-For; so ele e confiavel (REAL_IP_FROM).
  set_real_ip_from ${REAL_IP_FROM};
  real_ip_header X-Forwarded-For;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /logo.png {
    try_files /LogoPneumatic.png =404;
  }

  location = /api {
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Com o segredo, a API confia no X-Real-IP acima (IP real do cliente) para limite de tentativas e auditoria.
    proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
  }

  location /api/ {
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Com o segredo, a API confia no X-Real-IP acima (IP real do cliente) para limite de tentativas e auditoria.
    proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
  }

  location = /frontend {
    return 301 /frontend/;
  }

  location = /frontend/api {
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Com o segredo, a API confia no X-Real-IP acima (IP real do cliente) para limite de tentativas e auditoria.
    proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
  }

  location /frontend/api/ {
    rewrite ^/frontend(/api/.*)$ $1 break;
    proxy_pass ${API_UPSTREAM_URL};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Com o segredo, a API confia no X-Real-IP acima (IP real do cliente) para limite de tentativas e auditoria.
    proxy_set_header X-Proxy-Secret "${PROXY_SHARED_SECRET}";
  }

  location /frontend/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    rewrite ^/frontend/?(.*)$ /$1 break;
    try_files /html$uri $uri $uri/ /html/index.html;
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files /html$uri $uri $uri/ /html/index.html;
  }
}
