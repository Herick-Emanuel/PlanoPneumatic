services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plano_pneumatic}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-plano_pneumatic}
      # Sem senha padrao: defina no .env (a API recusa subir com senha fraca ou igual aos exemplos).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@planopneumatic.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Defina SEED_ADMIN_PASSWORD no arquivo .env (senha forte, 12+ caracteres)}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      # Operador de demonstracao: so e criado se SEED_OPERATOR_PASSWORD for definida.
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL:-operador@planopneumatic.com}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-}
      SEED_OPERATOR_NAME: ${SEED_OPERATOR_NAME:-Operador de Triagem}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      # Antivirus opcional: suba com `docker compose --profile antivirus up` e defina CLAMAV_HOST=clamav.
      # Integracao Omie (sem estas linhas o container nunca recebia as chaves do .env).
      OMIE_APP_KEY: ${OMIE_APP_KEY:-}
      OMIE_APP_SECRET: ${OMIE_APP_SECRET:-}
      OMIE_SYNC_INTERVAL_HOURS: ${OMIE_SYNC_INTERVAL_HOURS:-24}
      OMIE_MIRROR_INTERVAL_MINUTES: ${OMIE_MIRROR_INTERVAL_MINUTES:-10}
      OMIE_WEBHOOK_TOKEN: ${OMIE_WEBHOOK_TOKEN:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/health/db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${APP_PORT:-3000}:80"
    environment:
      PORT: 80
      API_UPSTREAM_URL: http://api:3000
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      # Local nao ha proxy na frente do Nginx: ignora X-Forwarded-For enviado pelo navegador.
      REAL_IP_FROM: 127.0.0.1
    depends_on:
      api:
        condition: service_healthy
    networks: [app]

  # F4: ClamAV para verificar anexos (opcional; primeira subida baixa as assinaturas, ~2 min).
  clamav:
    image: clamav/clamav:1.4
    profiles: [antivirus]
    expose: ["3310"]
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [app]

volumes:
  postgres_data:
  clamav_data:

networks:
  app:
